syntax = "proto3";

package peers.v1;

option go_package = "proto/peerspb";

message Event {
  bytes data = 1;
  string signature = 2;
  string timestamp = 3;
}
message Events {
  repeated Event events = 1;
}
message SendEvents {
  repeated string timestamps = 1;
}
message SendEventsAfterTimestamp {
  string timestamp = 1;
}
message PruneEvents {
  string before_timestamp = 1;
}

message DigestQuery {
  repeated uint32 path = 1;
}
message DigestQueries {
  uint32 merkle_depth = 1;
  repeated DigestQuery queries = 2;
}
message DigestUpdate {
  repeated uint32 path = 1;
  bytes digest = 2;
  string timestamp = 3;
}
message DigestUpdates {
  uint32 merkle_depth = 1;
  repeated DigestUpdate updates = 2;
}

message EventReconciliationMessage {
  oneof message {
    Events events = 1;
    SendEvents send_events = 2;
    SendEventsAfterTimestamp send_events_after_timestamp = 3;
    PruneEvents prune_events = 4;
    DigestQueries digest_queries = 5;
    DigestUpdates digest_updates = 6;
  }
}
