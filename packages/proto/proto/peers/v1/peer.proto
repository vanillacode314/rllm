syntax = "proto3";

package peers.v1;

option go_package = "proto/peers";

message SyncHandshake {
  string version = 1;
  optional bytes root_digest = 2;
  string client_id = 3;
}

message DigestQuery {
  repeated uint32 path = 1;
}

message DigestQueries {
  uint32 merkle_depth = 1;
  repeated DigestQuery queries = 2;
}

message DigestUpdate {
  repeated uint32 path = 1;
  bytes digest = 2;
  string timestamp = 3;
}

message DigestUpdates {
  uint32 merkle_depth = 1;
  repeated DigestUpdate updates = 2;
}

message EventBatchPayload {
  string timestamp = 1;
  string signature = 2;
  bytes data = 3;
}

message SendEventsAfterTimestamp {
  string timestamp = 1;
}

message EventBatch {
  repeated EventBatchPayload events = 1;
}

message SyncWireMessage {
  string account_id = 1;
  string client_id = 2;
  oneof payload {
    SyncHandshake handshake = 3;
    DigestQueries digest_queries = 4;
    DigestUpdates digest_updates = 5;
    EventBatch event_batch = 6;
    SendEventsAfterTimestamp send_events_after_timestamp = 7;
  }
}
