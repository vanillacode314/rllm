syntax = "proto3";

package peers.v1;

import "peers/v1/backup.proto";
import "peers/v1/broadcast.proto";
import "peers/v1/event_reconciliation.proto";

option go_package = "proto/peerspb";

message Capabilities {
  bool backup = 1;
  bool broadcast = 2;
  bool event_reconciliation = 3;
}

message Handshake {
  Capabilities capabilities = 3;
}

message PeerMessagePayload {
  oneof payload {
    Handshake handshake = 3;
    BackupMessage backup_message = 4;
    BroadcastMessage broadcast_message = 5;
    EventReconciliationMessage event_reconciliation = 6;
  }
}

message PeerMessage {
  string account_id = 1;
  string client_id = 2;
  PeerMessagePayload message = 3;
}
